name: Bug Report
description: Report a reproducible bug or issue in Tide Island Extended
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please check the [Wiki & FAQ](https://github.com/Bimbok/Tide-island-extended/wiki) first to see if your issue is already documented.
  - type: dropdown
    id: compositor
    attributes:
      label: Wayland Compositor
      description: What compositor are you using?
      options:
        - Hyprland
        - niri
        - Other (please specify in description)
    validations:
      required: true
  - type: dropdown
    id: distro
    attributes:
      label: Linux Distribution
      description: What distribution are you running?
      options:
        - Arch Linux / CachyOS / EndeavourOS
        - Fedora / Nobara / RHEL
        - Debian / Ubuntu / Linux Mint
        - openSUSE Tumbleweed / Leap
        - Nix / NixOS
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Tide Island Version
      description: What version or git commit are you running (e.g. v1.4.0 or git commit hash)?
      placeholder: "v1.4.0"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Open Control Center drawer
        2. Click on Equalizer pill
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs Actual Behavior
      description: What did you expect to happen, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs & Output
      description: Paste any terminal logs or output from `journalctl --user -u tide-island.service -n 50`.
      render: shell
