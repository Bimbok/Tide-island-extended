name: Release

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compatibility-build:
    name: Build on ${{ matrix.name }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Fedora 43
            image: fedora:43
            experimental: false
            install: >-
              dnf install -y gcc-c++ cmake ninja-build pkgconf-pkg-config git
              tar dbus-daemon qt6-qtbase-devel qt6-qtdeclarative-devel
              qt6-qt5compat systemd-devel
          - name: Debian 13
            image: debian:trixie
            experimental: false
            install: >-
              apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y
              build-essential cmake ninja-build pkg-config git tar dbus
              qt6-base-dev qt6-declarative-dev libudev-dev
              qml6-module-qt5compat-graphicaleffects
          - name: openSUSE Tumbleweed
            image: opensuse/tumbleweed
            experimental: true
            install: >-
              zypper --non-interactive --gpg-auto-import-keys refresh &&
              zypper --non-interactive install --no-recommends gcc-c++ cmake
              ninja pkg-config git tar gzip dbus-1 qt6-base-devel
              qt6-declarative-devel qt6-qt5compat-imports systemd-devel
    container:
      image: ${{ matrix.image }}

    steps:
      - name: Install build dependencies
        shell: bash
        run: ${{ matrix.install }}

      - name: Check out tagged source
        uses: actions/checkout@v5

      - name: Test installer branches
        run: tests/installer_tests.sh

      - name: Configure Tide Island
        run: |
          cmake -GNinja -S . -B build-release-ci \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build Tide Island
        run: cmake --build build-release-ci --parallel 2

      - name: Test Tide Island
        run: |
          ctest --test-dir build-release-ci --output-on-failure

      - name: Validate installation layout
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="$RUNNER_TEMP/tide-island-stage"
          libdir="$(sed -n 's/^CMAKE_INSTALL_LIBDIR:PATH=//p' build-release-ci/CMakeCache.txt)"
          test -n "$libdir"
          DESTDIR="$stage" cmake --install build-release-ci
          test -x "$stage/usr/bin/tide-island"
          test -x "$stage/usr/bin/tide-island-config-app"
          test -f "$stage/usr/share/tide-island/shell.qml"
          test -f "$stage/usr/$libdir/libIslandBackend.so"
          test -f "$stage/usr/$libdir/qt6/qml/IslandBackend/libIslandBackendplugin.so"
          test -f "$stage/usr/lib/systemd/user/tide-island.service"
          test ! -e "$stage/usr/$libdir/qt6/qml/TideIsland/Document.qml"
          test -z "$(find "$stage" -name '*qml_module_dir_map.qrc' -print -quit)"
          grep -Fq "/$libdir/qt6/qml\"" "$stage/usr/bin/tide-island"
          grep -Fq "prefer :/qt/qml/TideIsland/" "$stage/usr/$libdir/qt6/qml/TideIsland/qmldir"
          QT_QPA_PLATFORM=offscreen "$stage/usr/bin/tide-island-config-app" --validate-qml

  arch-package:
    name: Build Arch Linux package
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel

    steps:
      - name: Install build dependencies
        shell: bash
        run: |
          pacman-key --init || true
          pacman-key --populate archlinux || true
          pacman -Syu --noconfirm --needed \
            git cmake ninja pkgconf sudo \
            qt6-base qt6-declarative qt6-5compat qt6-wayland qt6-shadertools qt6-svg \
            systemd-libs wayland wayland-protocols mesa libdrm \
            cava cliphist pipewire wireplumber libpulse brightnessctl upower \
            bluez bluez-utils polkit zenity networkmanager wl-clipboard python psmisc quickshell

      - name: Check out tagged source
        uses: actions/checkout@v5

      - name: Setup builder user
        shell: bash
        run: |
          useradd -m -s /bin/bash builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build Arch Linux package
        shell: bash
        run: |
          sudo -u builder makepkg -f --noconfirm

      - name: Validate package installation
        shell: bash
        run: |
          set -Eeuo pipefail
          pkg_file=$(ls tide-island-extended-*.pkg.tar.zst | grep -v 'debug' | head -n1)
          pacman -U --noconfirm "$pkg_file"
          test -x /usr/bin/tide-island
          test -x /usr/bin/tide-island-config-app
          test -f /usr/share/tide-island/shell.qml
          test -f /usr/lib/systemd/user/tide-island.service
          test -f /usr/share/licenses/tide-island-extended/LICENSE
          QT_QPA_PLATFORM=offscreen /usr/bin/tide-island-config-app --validate-qml

      - name: Prepare package release assets
        shell: bash
        run: |
          set -Eeuo pipefail
          pkg_file=$(ls tide-island-extended-*.pkg.tar.zst | grep -v 'debug' | head -n1)
          cp "$pkg_file" tide-island-extended-x86_64.pkg.tar.zst
          chmod -R a+r "$GITHUB_WORKSPACE"

      - name: Upload Arch packages as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: arch-packages
          path: |
            tide-island-extended-*.pkg.tar.zst
            tide-island-extended-x86_64.pkg.tar.zst
          if-no-files-found: error

  publish-release:
    name: Publish release
    needs: [compatibility-build, arch-package]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate release version
        shell: bash
        run: |
          set -Eeuo pipefail
          version="${GITHUB_REF_NAME#v}"
          cmake_version="$(sed -nE 's/^project\(TideIsland VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)"
          pkgbuild_version="$(sed -nE 's/^pkgver=([0-9.]+)$/\1/p' PKGBUILD)"
          test -n "$version"
          test "$version" = "$cmake_version"
          test "$version" = "$pkgbuild_version"

      - name: Create reproducible source asset
        shell: bash
        run: |
          set -Eeuo pipefail
          version="${GITHUB_REF_NAME#v}"
          git archive \
            --format=tar \
            --prefix="Tide-island-${version}/" \
            "$GITHUB_SHA" \
            | xz -9e > tide-island-source.tar.xz
          tar -tf tide-island-source.tar.xz \
            "Tide-island-${version}/install.sh" >/dev/null

      - name: Download Arch packages
        uses: actions/download-artifact@v4
        with:
          name: arch-packages
          path: .

      - name: Generate release checksums
        shell: bash
        run: |
          set -Eeuo pipefail
          sha256sum tide-island-source.tar.xz tide-island-extended-*.pkg.tar.zst > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          release_assets=(
            tide-island-source.tar.xz
            tide-island-extended-*.pkg.tar.zst
            SHA256SUMS
          )
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${release_assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${release_assets[@]}" \
              --verify-tag \
              --generate-notes \
              --title "Tide Island Extended ${GITHUB_REF_NAME#v}"
          fi
